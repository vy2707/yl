<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CSS Animation 背景颜色变化</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			position: relative;
			isolation: isolate;
			display: flex;
			min-height: 100vh;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 28px;
			margin: 0;
			background: linear-gradient(125deg, #f8eee8, #f5f3e9 48%, #e8f2ef, #f2edf7);
			background-size: 240% 240%;
			color: #25313a;
			font-family: "Microsoft YaHei", sans-serif;
			animation: backgroundDrift 18s ease-in-out infinite alternate;
		}

		h1 {
			margin: 0;
			font-size: 28px;
			animation: titleIn 1s both;
		}

        h2{
            margin: 0;
            font-size: 18px;
            color: #666;
			animation: titleIn 1s .2s both;
        }
		.box {
			position: relative;
			display: grid;
			width: min(260px, 72vw);
			aspect-ratio: 1;
			place-items: center;
			border: 8px solid rgba(255, 255, 255, .7);
			border-radius: 16px;
			color: #fff;
			font-size: 22px;
			font-weight: bold;
			box-shadow: 0 16px 36px rgba(37, 49, 58, .18);
			animation: colorChange 8s linear infinite, float 5s ease-in-out infinite;
		}

		.box::before {
			position: absolute;
			inset: -16px;
			border: 2px dashed rgba(164, 19, 19, 0.9);
			border-radius: 24px;
			content: "";
			pointer-events: none;
			animation: frameBreathe 7s ease-in-out infinite;
		}

		@keyframes backgroundDrift {
			from { background-position: 0% 50%; }
			to { background-position: 100% 50%; }
		}

		@keyframes titleIn {
			from { opacity: 0; transform: translateY(12px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@keyframes float {
			0%, 100% { transform: translateY(0) rotate(-1deg); }
			50% { transform: translateY(-15px) rotate(1deg); }
		}

		@keyframes frameBreathe {
			0%, 100% { transform: scale(1); opacity:0.3; }
			50% { transform: scale(1.08); opacity: 1; }
		}

		@keyframes colorChange {
			0%, 100% { background-color: #e64b3c; }
			25% { background-color: #f2bd38; }
			50% { background-color: #38a878; }
			75% { background-color: #397fc1; }
		}
	</style>
</head>
<body>
	<h1>背景颜色动画</h1>
    <h2>630yaolin</h2>
	<div class="box">CSS animation</div>
</body>
</html>
