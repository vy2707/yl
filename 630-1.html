<style>
    /* 核心样式精简版 */
    .recommend-section {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    /* 标题 */
    .section-title {
      text-align: center;
      font-size: 24px;
      font-weight: 500;
      color: #333;
      margin-bottom: 20px;
    }

    /* 卡片横向滑动容器（单行，可横滑，隐藏滚动条） */
    .card-list {
      display: flex;
      flex-wrap: nowrap; /* 不换行，单行横滑 */
      gap: 20px; /* 卡片间距 */
      overflow-x: auto; /* 允许横向滑动 */
      scroll-snap-type: x proximity; /* 滑动到卡片附近时自动吸附 */
      scroll-behavior: smooth; /* 平滑滚动 */
      -webkit-overflow-scrolling: touch; /* iOS 惯性滑动 */
      /* 隐藏横向滚动条 */
      scrollbar-width: none;    /* Firefox */
      -ms-overflow-style: none; /* IE / 旧版 Edge */
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      padding-bottom: 4px;
    }

    /* Chrome / Safari / 新版 Edge 隐藏滚动条 */
    .card-list::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .card-list.dragging {
      cursor: grabbing;
    }

    /* 单个卡片骨架 */
    .card-item {
      flex: 0 0 auto; /* 不拉伸、不收缩，保持固定宽度 */
      width: clamp(260px, 32vw, 300px); /* 卡片宽度，桌面固定约 300px，小屏自适应 */
      aspect-ratio: 1080 / 790; /* 与图片实际比例一致，保证图片完整显示 */
      background-color: #f0f0f0; /* 图片空出来的灰色背景占位 */
      border-radius: 8px;
      position: relative; /* 关键：作为内部图片和文字的定位基准 */
      overflow: hidden; /* 防止图片溢出圆角 */
      cursor: grab;
      scroll-snap-align: start; /* 卡片吸附对齐 */
    }

    /* === 新增：卡片内的背景图片 === */
    .card-item img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 保证图片不变形并填满卡片 */
      display: block;
      pointer-events: none; /* 防止拖拽滑动时误选中图片 */
      -webkit-user-drag: none;
    }

    /* === 新增：左下角悬浮文字层 === */
    .card-text-overlay {
      position: absolute; /* 绝对定位，浮在图片上方 */
      bottom: 12px;       /* 距离底部 12px */
      left: 12px;         /* 距离左侧 12px */
      display: flex;
      align-items: center;
      gap: 8px;           /* 标签和文字的间距 */
      color: #ffffff;
      font-size: 14px;
      /* 文字阴影，防止在浅色背景图片上看不清 */
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); 
      z-index: 10;
    }

    /* 悬浮文字中的标签（如“商城”） */
    .card-text-overlay .tag {
      background-color: #ffffff;
      color: #000000;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 2px;
      font-weight: bold;
      text-shadow: none; /* 标签内的字不需要阴影 */
    }

    /* 底部导航点容器 */
    .dots-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
    }

    /* === 修改：使用 iconfont 图标实现导航圆点 === */
    .dot-icon {
      font-size: 8px;
      color: #d9d9d9; /* 默认浅灰色 */
      cursor: pointer;
      transition: color 0.3s, transform 0.3s;
    }

    /* 激活状态的圆点（深灰色） */
    .dot-icon.active {
      color: #666;
      transform: scale(1.2);
    }
</style>

  <div class="recommend-section">

            <!-- 卡片 11 -->
      <div class="card-item">
        <img src="./img/1-11.png" alt="封面图">
        
        <div class="card-text-overlay">
          <span class="tag">影视</span>

        </div>
      </div>

    </div>

    <!-- 底部导航点（移到卡片区下方，居中显示） -->
    <div class="dots-container">
        <!-- 使用 iconfont 的“圆点”图标 icon-yuandian 作为导航点 -->
        <i class="iconfont icon-yuandian dot-icon active"></i>
        <i class="iconfont icon-yuandian dot-icon"></i>
        <i class="iconfont icon-yuandian dot-icon"></i>
    </div>
    </div>

  <script>
    (() => {
      const list = document.querySelector('.card-list');
      const dotsWrap = document.querySelector('.dots-container');

      // 一页 = 一屏宽度，据此动态生成圆点（圆点数量会自动适应屏幕与卡片数量）
      const buildDots = () => {
        const pageCount = Math.max(1, Math.ceil(list.scrollWidth / list.clientWidth));
        dotsWrap.innerHTML = '';
        for (let i = 0; i < pageCount; i++) {
          const dot = document.createElement('i');
          dot.className = 'iconfont icon-yuandian dot-icon';
          if (i === 0) dot.classList.add('active');
          dot.dataset.page = i;
          dotsWrap.appendChild(dot);
        }
        return dotsWrap.querySelectorAll('.dot-icon');
      };

      let dots = buildDots();

      // 当前页 = 当前滚动位置 / 一屏宽度
      const activePage = () =>
        Math.min(Math.round(list.scrollLeft / list.clientWidth), Math.max(0, dots.length - 1));

      const updateDots = () => {
        const page = activePage();
        dots.forEach((d, i) => d.classList.toggle('active', i === page));
      };

      // 点击圆点 → 滑动到对应页
      dotsWrap.addEventListener('click', (e) => {
        const dot = e.target.closest('.dot-icon');
        if (!dot) return;
        const page = Number(dot.dataset.page);
        const maxLeft = list.scrollWidth - list.clientWidth;
        list.scrollTo({ left: Math.min(page * list.clientWidth, maxLeft), behavior: 'smooth' });
      });

      // 滚动时更新圆点（用 requestAnimationFrame 节流）
      let ticking = false;
      list.addEventListener('scroll', () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          updateDots();
          ticking = false;
        });
      });

      // 鼠标拖拽横向滑动（触屏设备使用原生滚动即可）
      let isDown = false, startX = 0, startScroll = 0;
      list.addEventListener('pointerdown', (e) => {
        if (e.pointerType !== 'mouse') return;
        isDown = true;
        startX = e.clientX;
        startScroll = list.scrollLeft;
        list.style.scrollBehavior = 'auto'; // 拖拽期间关闭平滑滚动，跟手更顺
        list.classList.add('dragging');
        list.setPointerCapture(e.pointerId);
      });
      list.addEventListener('pointermove', (e) => {
        if (!isDown) return;
        list.scrollLeft = startScroll - (e.clientX - startX);
      });
      const endDrag = (e) => {
        if (!isDown) return;
        isDown = false;
        list.classList.remove('dragging');
        list.style.scrollBehavior = 'smooth';
        if (e && list.hasPointerCapture && list.hasPointerCapture(e.pointerId)) {
          list.releasePointerCapture(e.pointerId);
        }
      };
      list.addEventListener('pointerup', endDrag);
      list.addEventListener('pointercancel', endDrag);
      list.addEventListener('pointerleave', endDrag);

      // 窗口尺寸变化时重新计算并重建圆点
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          dots = buildDots();
          updateDots();
        }, 150);
      });

      updateDots();
    })();
  </script>
</body>
