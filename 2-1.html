<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <h2>姚琳的第一个网页:html元素</h2>
    <h3>开始标签、结束标记tag,内容与样式相分离</h3>
    <h5>html的语义性</h5>
    <h4>静夜思</h4>
    床前明月光<br>
    <p>疑是地上霜</p>
    <p>举头望明月 </p>
    <p>低头思故乡</p>

        <li>东风</li>
        <li>鹰击</li>

        <li>巨浪</li>
    </ul>
    
    <div style="background-color: #caaef3;font-size: 40px;width: 100px;color: #89156a;">姚琳</div>
    <!--区域，块级元素-->
    <!--扩展题目：我的名字，在同一行，不同颜色显示-->
    <!--注释：ctrl+/-->
     <span style="color: #caaef3;font-size: 40px;">姚</span><!--span是行间元素-->
     <span style="color: #89156a;font-size: 40px;">琳</span><!--span是行间元素-->
