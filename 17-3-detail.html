<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!--
	姓名：姚琳
	日期：2026-11-02
	功能名称：商品详情展示（fetch + DummyJSON，按 ID 获取）
	-->
	<title>17-3-detail 商品详情</title>
	<link rel="stylesheet" href="font/iconfont.css">
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			background: #f3f0e8;
			color: #26343a;
			font-family: "Microsoft YaHei", sans-serif;
		}

		.yl_main {
			width: min(1000px, 100%);
			margin: 0 auto;
			padding: 3rem 1.5rem 4rem;
		}

		.yl_header {
			display: flex;
			align-items: end;
			justify-content: space-between;
			gap: 1rem;
			margin-bottom: 1.5rem;
			padding-bottom: 1.25rem;
			border-bottom: 1px solid #d5d5cc;
		}

		.yl_header h1 {
			margin: 0;
			font-size: 2rem;
			font-weight: 600;
		}

		.yl_subtitle {
			margin: .5rem 0 0;
			color: #667579;
			font-size: .95rem;
		}

		.yl_author {
			flex: 0 0 auto;
			color: #a34e3c;
			font-size: 1rem;
			font-weight: 600;
		}

		.yl_home_link {
			display: inline-block;
			margin-bottom: 2rem;
			color: #3976a3;
			text-decoration: none;
			font-size: .9rem;
		}

		.yl_home_link:hover {
			text-decoration: underline;
		}

		.yl_block {
			margin-bottom: 2.5rem;
		}

		.yl_block h2 {
			margin: 0 0 .5rem;
			font-size: 1.3rem;
			font-weight: 600;
			color: #3976a3;
		}

		.yl_api {
			display: flex;
			align-items: center;
			gap: .8rem;
			flex-wrap: wrap;
			padding: .8rem 1rem;
			background: #26343a;
			border-radius: .5rem;
			color: #e8eef2;
			font-family: Consolas, monospace;
			font-size: .85rem;
			margin-bottom: 1rem;
		}

		.yl_api .yl_tag {
			flex: 0 0 auto;
			padding: .15rem .55rem;
			background: #3976a3;
			color: #fff;
			border-radius: .4rem;
			font-size: .75rem;
			font-family: "Microsoft YaHei", sans-serif;
		}

		.yl_api .yl_url {
			flex: 1;
			min-width: 200px;
			word-break: break-all;
		}

		.yl_status {
			margin-bottom: 1rem;
			padding: .7rem 1rem;
			border-radius: .4rem;
			font-size: .85rem;
		}

		.yl_status_ok {
			background: #eaf3ea;
			color: #3c7a3c;
		}

		.yl_status_err {
			background: #fbeaea;
			color: #a33b3b;
		}

		/* ===== 详情主体 ===== */
		.yl_detail {
			display: grid;
			grid-template-columns: 340px 1fr;
			gap: 1.5rem;
			background: #fff;
			border: 1px solid #e2e0d6;
			border-radius: .6rem;
			padding: 1.2rem;
			box-shadow: 0 .4rem 1rem rgba(38, 52, 58, .06);
		}

		@media (max-width: 720px) {
			.yl_detail {
				grid-template-columns: 1fr;
			}
		}

		.yl_main_img {
			width: 100%;
			aspect-ratio: 1 / 1;
			object-fit: contain;
			background: #faf9f4;
			border: 1px solid #e2e0d6;
			border-radius: .5rem;
			display: block;
		}

		.yl_thumbs {
			display: flex;
			flex-wrap: wrap;
			gap: .5rem;
			margin-top: .7rem;
		}

		.yl_thumb {
			width: 56px;
			height: 56px;
			object-fit: contain;
			background: #faf9f4;
			border: 1px solid #e2e0d6;
			border-radius: .4rem;
			cursor: pointer;
		}

		.yl_thumb.yl_active {
			border-color: #3976a3;
			box-shadow: 0 0 0 2px rgba(57, 118, 163, .25);
		}

		.yl_info_title {
			font-size: 1.4rem;
			font-weight: 700;
			color: #26343a;
			margin: 0 0 .3rem;
		}

		.yl_info_cat {
			font-size: .82rem;
			color: #8a9499;
			margin-bottom: .8rem;
		}

		.yl_price_row {
			display: flex;
			align-items: baseline;
			gap: .7rem;
			margin-bottom: .6rem;
		}

		.yl_price {
			color: #d92b2b;
			font-weight: 700;
			font-size: 1.6rem;
		}

		.yl_price_orig {
			color: #a0a8ac;
			text-decoration: line-through;
			font-size: .9rem;
		}

		.yl_discount {
			color: #d92b2b;
			font-size: .85rem;
			font-weight: 600;
		}

		.yl_rating {
			display: flex;
			align-items: center;
			gap: .35rem;
			margin-bottom: .8rem;
		}

		.yl_stars {
			color: #e0a53c;
			font-size: .85rem;
			letter-spacing: 1px;
		}

		.yl_rating_val {
			color: #667579;
			font-size: .85rem;
		}

		.yl_desc {
			margin: 0 0 1rem;
			color: #667579;
			font-size: .9rem;
			line-height: 1.7;
		}

		.yl_props {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
			gap: .6rem;
			margin-bottom: 1rem;
		}

		.yl_prop {
			background: #faf9f4;
			border: 1px solid #eae7dd;
			border-radius: .4rem;
			padding: .5rem .7rem;
		}

		.yl_prop .yl_k {
			font-size: .72rem;
			color: #a0a8ac;
		}

		.yl_prop .yl_v {
			font-size: .86rem;
			color: #26343a;
			margin-top: .15rem;
			word-break: break-all;
		}

		.yl_tags {
			display: flex;
			flex-wrap: wrap;
			gap: .4rem;
			margin-bottom: 1rem;
		}

		.yl_tag_item {
			padding: .2rem .6rem;
			background: #e8eef2;
			color: #3976a3;
			border-radius: .9rem;
			font-size: .76rem;
		}

		.yl_back {
			display: inline-block;
			padding: .5rem .95rem;
			background: #3976a3;
			color: #fff;
			border: none;
			border-radius: .4rem;
			font-size: .85rem;
			cursor: pointer;
			text-decoration: none;
		}

		.yl_back:hover {
			background: #2d6085;
		}
	</style>
</head>
<body>
	<main class="yl_main">
		<header class="yl_header">
			<div>
				<h1>商品详情</h1>
				<p class="yl_subtitle">通过 URL 参数 <code>?id=</code> 指定商品 ID，用 fetch 获取单个商品详情</p>
			</div>
			<div class="yl_author">姚琳 · 17-3-detail</div>
		</header>

		<a class="yl_home_link" href="17-3.html">← 返回商品列表 17-3.html</a>

		<section class="yl_block">
			<div class="yl_api">
				<span class="yl_tag">详情接口</span>
				<span class="yl_url" id="yl_url">https://dummyjson.com/products/1</span>
			</div>

			<div class="yl_status" id="yl_status">正在加载数据…</div>
			<div id="yl_detail"></div>
		</section>
	</main>

	<script>
		// 读取 URL 参数 id，缺省为 1
		var yl_params = new URLSearchParams(window.location.search);
		var yl_id = yl_params.get('id') || '1';
		var yl_url = 'https://dummyjson.com/products/' + yl_id;

		var yl_urlEl = document.getElementById('yl_url');
		var yl_statusEl = document.getElementById('yl_status');
		var yl_detailEl = document.getElementById('yl_detail');

		function yl_prop(yl_k, yl_v) {
			var yl_box = document.createElement('div');
			yl_box.className = 'yl_prop';
			var yl_key = document.createElement('div');
			yl_key.className = 'yl_k';
			yl_key.textContent = yl_k;
			var yl_val = document.createElement('div');
			yl_val.className = 'yl_v';
			yl_val.textContent = yl_v;
			yl_box.appendChild(yl_key);
			yl_box.appendChild(yl_val);
			return yl_box;
		}

		function yl_render(yl_p) {
			yl_detailEl.innerHTML = '';

			var yl_wrap = document.createElement('div');
			yl_wrap.className = 'yl_detail';

			// 左侧：主图 + 缩略图
			var yl_left = document.createElement('div');
			var yl_mainImg = document.createElement('img');
			yl_mainImg.className = 'yl_main_img';
			yl_mainImg.id = 'yl_main_img';
			yl_mainImg.src = yl_p.images && yl_p.images[0] ? yl_p.images[0] : yl_p.thumbnail;
			yl_mainImg.alt = yl_p.title;
			yl_left.appendChild(yl_mainImg);

			var yl_thumbs = document.createElement('div');
			yl_thumbs.className = 'yl_thumbs';
			var yl_images = yl_p.images && yl_p.images.length ? yl_p.images : [yl_p.thumbnail];
			for (var yl_i = 0; yl_i < yl_images.length; yl_i++) {
				var yl_thumb = document.createElement('img');
				yl_thumb.className = 'yl_thumb' + (yl_i === 0 ? ' yl_active' : '');
				yl_thumb.src = yl_images[yl_i];
				yl_thumb.alt = '缩略图 ' + (yl_i + 1);
				yl_thumb.onclick = (function (yl_src, yl_ths) {
					return function () {
						yl_mainImg.src = yl_src;
						for (var yl_j = 0; yl_j < yl_ths.length; yl_j++) {
							yl_ths[yl_j].classList.remove('yl_active');
						}
						this.classList.add('yl_active');
					};
				})(yl_images[yl_i], yl_thumbs.children);
				yl_thumbs.appendChild(yl_thumb);
			}
			yl_left.appendChild(yl_thumbs);

			// 右侧：信息
			var yl_right = document.createElement('div');

			var yl_title = document.createElement('h3');
			yl_title.className = 'yl_info_title';
			yl_title.textContent = yl_p.title;

			var yl_cat = document.createElement('div');
			yl_cat.className = 'yl_info_cat';
			yl_cat.textContent = (yl_p.brand ? yl_p.brand + ' · ' : '') + yl_p.category;

			var yl_priceRow = document.createElement('div');
			yl_priceRow.className = 'yl_price_row';
			var yl_price = document.createElement('span');
			yl_price.className = 'yl_price';
			yl_price.textContent = '$' + yl_p.price;
			yl_priceRow.appendChild(yl_price);

			if (yl_p.discountPercentage > 0) {
				var yl_orig = document.createElement('span');
				yl_orig.className = 'yl_price_orig';
				var yl_origPrice = (yl_p.price / (1 - yl_p.discountPercentage / 100)).toFixed(2);
				yl_orig.textContent = '$' + yl_origPrice;
				var yl_disc = document.createElement('span');
				yl_disc.className = 'yl_discount';
				yl_disc.textContent = '-' + Math.round(yl_p.discountPercentage) + '%';
				yl_priceRow.appendChild(yl_orig);
				yl_priceRow.appendChild(yl_disc);
			}

			var yl_rating = document.createElement('div');
			yl_rating.className = 'yl_rating';
			var yl_stars = document.createElement('span');
			yl_stars.className = 'yl_stars';
			yl_stars.textContent = '★'.repeat(Math.round(yl_p.rating)) + '☆'.repeat(5 - Math.round(yl_p.rating));
			var yl_ratingVal = document.createElement('span');
			yl_ratingVal.className = 'yl_rating_val';
			yl_ratingVal.textContent = yl_p.rating.toFixed(2) + ' / 5';
			yl_rating.appendChild(yl_stars);
			yl_rating.appendChild(yl_ratingVal);

			var yl_desc = document.createElement('p');
			yl_desc.className = 'yl_desc';
			yl_desc.textContent = yl_p.description;

			var yl_props = document.createElement('div');
			yl_props.className = 'yl_props';
			yl_props.appendChild(yl_prop('库存', yl_p.stock));
			yl_props.appendChild(yl_prop('状态', yl_p.availabilityStatus || '—'));
			yl_props.appendChild(yl_prop('SKU', yl_p.sku || '—'));
			yl_props.appendChild(yl_prop('重量', yl_p.weight !== undefined ? yl_p.weight + ' g' : '—'));
			yl_props.appendChild(yl_prop('起订量', yl_p.minimumOrderQuantity !== undefined ? yl_p.minimumOrderQuantity : '—'));
			yl_props.appendChild(yl_prop('退换政策', yl_p.returnPolicy || '—'));

			var yl_tags = document.createElement('div');
			yl_tags.className = 'yl_tags';
			var yl_tagList = yl_p.tags || [];
			for (var yl_k = 0; yl_k < yl_tagList.length; yl_k++) {
				var yl_tag = document.createElement('span');
				yl_tag.className = 'yl_tag_item';
				yl_tag.textContent = yl_tagList[yl_k];
				yl_tags.appendChild(yl_tag);
			}

			yl_right.appendChild(yl_title);
			yl_right.appendChild(yl_cat);
			yl_right.appendChild(yl_priceRow);
			yl_right.appendChild(yl_rating);
			yl_right.appendChild(yl_desc);
			yl_right.appendChild(yl_props);
			yl_right.appendChild(yl_tags);

			yl_wrap.appendChild(yl_left);
			yl_wrap.appendChild(yl_right);
			yl_detailEl.appendChild(yl_wrap);

			yl_statusEl.className = 'yl_status yl_status_ok';
			yl_statusEl.textContent = '请求成功，已加载商品 #' + yl_p.id + '「' + yl_p.title + '」。';
		}

		function yl_load() {
			yl_urlEl.textContent = yl_url;
			yl_statusEl.className = 'yl_status yl_status_ok';
			yl_statusEl.textContent = '正在请求 ' + yl_url + ' …';
			yl_detailEl.innerHTML = '';

			fetch(yl_url)
				.then(function (yl_res) {
					if (!yl_res.ok) { throw new Error('HTTP ' + yl_res.status); }
					return yl_res.json();
				})
				.then(function (yl_data) {
					yl_render(yl_data);
				})
				.catch(function (yl_err) {
					yl_statusEl.className = 'yl_status yl_status_err';
					yl_statusEl.textContent = '请求失败：' + yl_err.message + '。请检查网络连接或商品 ID 是否正确。';
					yl_detailEl.innerHTML = '';
				});
		}

		yl_load();
	</script>
</body>
</html>
