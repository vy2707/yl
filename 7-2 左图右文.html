<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{

        }
        .zitem{
            display: flex;
            padding:10px 5px;/*左右是10px，上下是5px*/
            margin-bottom:5px;/*与下一项之间的间距*/
            border-bottom:1px dotted #ccc;/*边框*/
            /*align-items: center;/*垂直居中*/
        }
        .zitem img{
            width:100px;
            /*margin-right: 12px;/*图片与文字之间的间距*/
        }
        .ytext{
            flex-grow:1;
            margin-left:18px;/*文字与图片之间的间距*/
            display:flex;
            flex-wrap:wrap;/*换行*/
        }
        .ytext h3{
            width:100%;
            font-size:16px;
            font-weight:bold;/*加粗*/
            line-height:42px;/*行高*/
            color:#333;
        }
        .author{
            flex-grow:1;
            padding-left:2px;
        }
        .ytext .time{
            margin-right:20px;
        }

    </style>
</head>
<body>
    <div class="box">
        <div class="zitem">
            <img src="img/4.jpg">

            <h3>标题</h3><!--这是左图右文的布局-->

        </div>
