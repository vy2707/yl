<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>630 姚琳</title>
    <style>
        p{
            color: rgb(205, 171, 255);
            font-size: 40px;
        }
        /*标签选择器*/
        /*所有id选择器都是以#开头的*/
        #box{
            width:600px;
            height:400px;
            background-color: rgb(47, 133, 238);
        }
        /*拓展3:选择器三个字是白色或新增一个宽300高300的盒子,有背景颜色*/
        .new-box{
            width:300px;
            height:300px;
            background-color: rgb(80, 255, 226);
        }
        /*id选择器,以#开头的*/
        .n1{
            color: rgb(132, 52, 193);
        }
        .n2{
            color: rgb(83, 60, 212);
        }
        /*选择器三个字白色 */
        .n3{
            color: white;
        }
        /* 标签选择器：给h2设置样式 */
        h2 {
            color: white;
            background-color: black;
        }

    </style>
</head>
<body>
    <h2>层叠样式表 CSS</h2>
    <div id="box">
        <p>CSS<span class="n3">选择器</span></p>
        <p><span class="n1">姚</span><span class="n2">琳</span></p>
        <p>CSS属性</p>

    </div>
    <!--拓展1：名字每个字都不同颜色，在同一行-->
    <!--拓展2：h2黑底白字-->
    <!--拓展3：选择器三个字是白色或新增一个宽300高300的盒子，有背景颜色-->

</body>
</html>
