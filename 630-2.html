<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ音乐导航栏复刻</title>
    <link rel="stylesheet" href="font_1/iconfont.css">
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #fff;
            /* 为了演示方便，加一点上边距 */
            padding-top: 20px;
        }

        /* 顶部主容器 */
        .header-wrapper {
            width: 100%;
            border-bottom: 1px solid #f0f0f0;
            min-width: 1200px; /* 保证布局不乱 */
        }

        /* 顶部第一行：Logo、主导航、搜索、登录按钮 */
        .header-main {
            display: flex;
            align-items: center;
            height: 90px; /* 头部高度 */
            padding: 0 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- Logo 区域 --- */
        .logo-area {
            display: flex;
            align-items: center;
            margin-right: 40px;
            cursor: pointer;
            text-decoration: none;
            color: #000;
        }

        .logo-icon {
            font-size: 50px;
            color: #31c27c;
            margin-right: 10px;
            line-height: 1;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 500;
            letter-spacing: -1px;
        }

        /* --- 主导航菜单 --- */
        .main-nav {
            display: flex;
            height: 100%;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            font-size: 16px;
            color: #333;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            transition: color 0.3s;
        }

        .nav-item:hover {
            color: #31c27c;
        }

        /* 选中的“音乐馆”样式 */
        .nav-item.active {
            background-color: #31c27c;
            color: #fff;
            font-weight: 500;
        }
        
        .nav-item.active:hover {
            color: #fff; /* 选中状态悬停不变色 */
        }

        /* 特殊标记：抢特权 */
        .badge {
            position: absolute;
            top: 20px;
            right: 10px;
            background-color: #c9a063; /* 金色背景 */
            color: #fff;
            font-size: 10px;
            padding: 1px 3px;
            border-radius: 2px;
            transform: scale(0.9);
        }

        /* --- 右侧功能区 --- */
        .header-right {
            margin-left: auto; /* 推到最右边 */
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* 搜索框 */
        .search-box {
            position: relative;
            width: 220px;
        }

        .search-input {
            width: 100%;
            height: 36px;
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 0 10px;
            padding-right: 35px;
            font-size: 14px;
            color: #333;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: #31c27c;
        }

        .search-input::placeholder {
            color: #999;
        }

        .search-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: #999;
            cursor: pointer;
        }

        /* 登录链接 */
        .login-link {
            font-size: 16px;
            color: #333;
            text-decoration: none;
            cursor: pointer;
        }
        .login-link:hover {
            color: #31c27c;
        }

        /* 按钮通用样式 */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            padding: 0 15px;
            font-size: 14px;
            border-radius: 3px;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* 开通VIP按钮 */
        .btn-vip {
            background-color: #31c27c;
            color: #fff;
            border: none;
            padding-right: 8px; /* 给箭头留空间 */
        }
        
        .btn-vip .arrow-down {
            margin-left: 5px;
            border: 4px solid transparent;
            border-top-color: #fff;
            margin-top: 4px;
        }

        /* 充值按钮 */
        .btn-recharge {
            background-color: #fff;
            color: #333;
            border: 1px solid #ccc;
            padding-right: 8px;
        }

        .btn-recharge .arrow-down {
            margin-left: 5px;
            border: 4px solid transparent;
            border-top-color: #333;
            margin-top: 4px;
        }

        /* --- 底部二级导航 --- */
        .sub-nav-bar {
            display: flex;
            justify-content: center; /* 居中显示 */
            align-items: center;
            height: 50px;
            gap: 30px;
        }

        .sub-nav-item {
            font-size: 15px;
            color: #333;
            text-decoration: none;
            cursor: pointer;
        }

        .sub-nav-item:hover {
            color: #31c27c;
        }

    </style>
</head>
<body>

    <div class="header-wrapper">
        <!-- 第一行 -->
        <div class="header-main">
            <!-- Logo -->
            <a href="#" class="logo-area">
                <i class="iconfont icon-qqmusic logo-icon"></i>
                <span class="logo-text">QQ音乐</span>
            </a>

            <!-- 主导航 -->
            <nav class="main-nav">
                <a href="#" class="nav-item active">音乐馆</a>
                <a href="#" class="nav-item">我的音乐</a>
                <a href="#" class="nav-item">
                    客户端
                </a>
                <a href="#" class="nav-item">开放平台</a>
                <a href="#" class="nav-item">
                    VIP
                    <!-- 这里用绝对定位模拟黄色标签 -->
                </a>
            </nav>

            <!-- 右侧功能 -->
            <div class="header-right">
                <!-- 搜索框 -->
                <div class="search-box">
                    <input type="text" class="search-input" placeholder="搜索音乐、MV、歌单、用户">
                    <svg class="search-icon" viewBox="0 0 24 24">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                </div>

                <!-- 登录 -->
                <a href="#" class="login-link">登录</a>

                <!-- 开通VIP -->
                <button class="btn btn-vip">
                    开通VIP
                    <span class="arrow-down"></span>
                </button>

                <!-- 充值 -->
                <button class="btn btn-recharge">
                    充值
                    <span class="arrow-down"></span>
                </button>
            </div>
        </div>

        <!-- 第二行：分类导航 -->
        <div class="sub-nav-bar">
            <a href="#" class="sub-nav-item">首页</a>
            <a href="#" class="sub-nav-item">歌手</a>
            <a href="#" class="sub-nav-item">新碟</a>
            <a href="#" class="sub-nav-item">排行榜</a>
            <a href="#" class="sub-nav-item">分类歌单</a>
            <a href="#" class="sub-nav-item">雷达</a>
            <a href="#" class="sub-nav-item">MV</a>
            <a href="#" class="sub-nav-item">数字专辑</a>
        </div>
    </div>

</body>
</html>
