<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
    姓名：姚琳
    日期：2026-10-26
    功能名称：QQ音乐导航栏复刻
    -->
    <title>QQ音乐导航栏复刻</title>
    <link rel="stylesheet" href="font_1/iconfont.css">
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* 使用官方字体栈 */
            font-family: poppin, Tahoma, Arial, 微软雅黑, sans-serif;
        }

        body {
            background-color: #fff;
            padding-top: 20px;
        }

        /* 顶部主容器 */
        .yl_header-wrapper {
            width: 100%;
            border-bottom: 1px solid #f0f0f0;
            min-width: 1200px;
        }

        /* 顶部第一行 */
        .yl_header-main {
            display: flex;
            align-items: center;
            height: 90px;
            padding: 0 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- Logo 区域 --- */
        .yl_logo-area {
            display: flex;
            align-items: center;
            margin-right: 40px;
            cursor: pointer;
            text-decoration: none;
        }

        .yl_qqmusic-logo {
            height: 44px; 
            width: auto;
            display: block;
        }

        /* --- 主导航菜单 --- */
        .yl_main-nav {
            display: flex;
            height: 100%;
        }

        .yl_nav-item {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            font-size: 16px;
            color: #333;
            text-decoration: none;
            cursor: pointer;
            position: relative; /* 为角标定位提供参照 */
            transition: color 0.3s;
        }

        .yl_nav-item:hover {
            color: #31c27c;
        }

        /* 选中的“音乐馆”样式 */
        .yl_nav-item.active {
            background-color: #31c27c;
            color: #fff;
            font-weight: 500;
        }
        
        .yl_nav-item.active:hover {
            color: #fff;
        }

        /* --- 抢特权角标（本地图片版） --- */
        .yl_top_nav_mark {
            position: absolute;
            top: 25px; 
            right: 3px; /* 负数，往右偏移 */
            width: 32px;  /*37*/
            height: 12px; /*14*/
            border-radius: 2px; /* 圆角 */
        }

        /* --- 右侧功能区 --- */
        .yl_header-right {
            margin-left: 40px;
            display: flex;
            align-items: center;
        }

        /* 搜索框 */
        .yl_search-box {
            position: relative;
            width: 220px;
        }

        .yl_search-input {
            width: 100%;
            height: 36px;
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 0 10px;
            padding-right: 35px;
            font-size: 14px;
            color: #333;
            outline: none;
            transition: border-color 0.3s;
        }

        .yl_search-input:focus {
            border-color: #31c27c;
        }

        .yl_search-input::placeholder {
            color: #999;
        }

        .yl_search-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: #999;
            cursor: pointer;
        }

        /* 登录链接 */
        .yl_login-link {
            font-size: 16px; 
            color: #000000; 
            text-decoration: none;
            cursor: pointer;
            margin: 0 10px 0 25px; /* 调整左右间距 */
        }
        .yl_login-link:hover {
            color: #31c27c;
        }

        /* 按钮通用样式 */
        .yl_btn {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px; /* 改为官方高度约 40px */
            font-size: 13px; /* 官方字号 */
            border-radius: 3px;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .yl_btn:hover {
            opacity: 0.9;
        }

        /* 开通VIP按钮 */
        .yl_btn-vip {
            width: 122px; /* 官方宽度 121.99px */
            background-color: #31c27c;
            color: #fff;
            padding: 0;
            border: none;
            display: flex;
            height: 39px;
            align-items: center; /* 水平垂直居中 */
            position: relative; /* 给子图标做定位参照 */

        }
        .yl_btn-vip .iconfont {
            position: absolute;
            right: -4px;   /* 离右边一点点距离，紧贴右下角 */
            bottom: 2px;  /* 离底边一点点距离 */
            color: #fff;
            font-size: 32px;
            line-height: 1;
            margin-left: 0;
        }
       
        /*充值按钮*/
        .yl_btn-recharge {
            background-color: #fff;
            color: #333;
            border: 1px solid #ccc;
            margin-left: 10px;
            padding: 0 26px;
            height: 40px;
            padding-left: 18px;
            padding-right: 26px;
            position: relative;
        }

        .yl_btn-recharge .iconfont {
            position: absolute;
            right: -5px;
            color: #333;
            font-size: 33px;
            right: -5px;   /* 离右边一点点距离，紧贴右下角 */
            bottom: -3px;  /* 离底边一点点距离 */
        }

        /* --- 底部二级导航【重点修改】 --- */
        .yl_sub-nav-wrap {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .yl_sub-nav-bar {
            display: flex;
            align-items: center;
            height: 50px;
            gap: 46px;
            /* 关键：缩进，和音乐馆文字起点对齐 */
            margin-left: calc(44px + 190px);
        }

        .yl_sub-nav-item {
            font-size: 15px;
            color: #333;
            text-decoration: none;
            cursor: pointer;
        }

        .yl_sub-nav-item:hover {
            color: #31c27c;
        }

    </style>
</head>
<body>

    <div class="yl_header-wrapper">
        <!-- 第一行 -->
        <div class="yl_header-main">
            <!-- Logo -->
            <a href="#" class="yl_logo-area">
                <img src="./img/QQyinyue.png" alt="QQ音乐" class="yl_qqmusic-logo">
            </a>

            <!-- 主导航 -->
            <nav class="yl_main-nav">
                <a href="#" class="yl_nav-item active">音乐馆</a>
                <a href="#" class="yl_nav-item">我的音乐</a>
                <!-- 在这里加上角标 -->
                <a href="#" class="yl_nav-item">
                    客户端
                    <img src="./img/badge.png" class="yl_top_nav_mark" alt="抢特权">
                </a>
                <a href="#" class="yl_nav-item">开放平台</a>
                <a href="#" class="yl_nav-item">VIP</a>
            </nav>

            <!-- 右侧功能 -->
            <div class="yl_header-right">
                <!-- 搜索框 -->
                <div class="yl_search-box">
                    <input type="text" class="yl_search-input" placeholder="搜索音乐、MV、歌单、用户">
                    <svg class="yl_search-icon" viewBox="0 0 24 24">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                </div>

                <!-- 登录 -->
                <a href="#" class="yl_login-link">登录</a>

                <!-- 开通VIP -->
                <button class="yl_btn yl_btn-vip">
                    开通VIP
                    <i class="iconfont icon-youshixinjiantou"></i>
                </button>

                <!-- 充值 -->
                <button class="yl_btn yl_btn-recharge">
                    充值
                    <i class="iconfont icon-youshixinjiantou"></i>
                </button>
            </div>
        </div>

        <!-- 第二行：分类导航 -->
        <div class="yl_sub-nav-wrap">
            <div class="yl_sub-nav-bar">
                <a href="#" class="yl_sub-nav-item">首页</a>
                <a href="#" class="yl_sub-nav-item">歌手</a>
                <a href="#" class="yl_sub-nav-item">新碟</a>
                <a href="#" class="yl_sub-nav-item">排行榜</a>
                <a href="#" class="yl_sub-nav-item">分类歌单</a>
                <a href="#" class="yl_sub-nav-item">雷达</a>
                <a href="#" class="yl_sub-nav-item">MV</a>
                <a href="#" class="yl_sub-nav-item">数字专辑</a>
            </div>
        </div>
    </div>

</body>
</html>
