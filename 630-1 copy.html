<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一页三张卡片带左右箭头</title>
    <!-- 替换为你自己的 iconfont 路径 -->
    <link rel="stylesheet" href="./font_1/iconfont.css">
</head>
<body>

<style>
    /* 基础重置 */
    * { box-sizing: border-box; }
    body { margin: 0; background-color: #f7f7f7; } /* 方便看清边界 */

    /* 主容器：控制整体宽度和居中 */
    .recommend-section {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      position: relative; /* 为绝对定位的箭头提供基准 */
    }

    .section-title {
      text-align: center;
      font-size: 24px;
      font-weight: 500;
      color: #333;
      margin-bottom: 20px;
    }

    /* === 新增：轮播图外层包裹器 === */
    .carousel-wrapper {
      position: relative;
      /* 左右各留出 50px 给箭头，避免箭头遮挡卡片 */
      padding: 0 50px; 
    }

    /* 卡片滑动容器 */
    .card-list {
      display: flex;
      flex-wrap: nowrap;
      gap: 20px; /* 卡片间距 */
      overflow-x: auto; 
      scroll-snap-type: x mandatory; 
      scroll-behavior: smooth; 
      -webkit-overflow-scrolling: touch; 
      scrollbar-width: none;    
      -ms-overflow-style: none; 
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      padding-bottom: 10px; /* 留点空间防止阴影被切 */
    }

    .card-list::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .card-list.dragging {
      cursor: grabbing;
    }

    /* === 修改：卡片宽度 === */
    .card-item {
      flex: 0 0 auto; 
      /* 计算逻辑：整个轮播区宽度(100%) - 左右padding(100px) - 2个间距(40px)，剩下的平分3份 */
      /* 这样保证一页刚好放下 3 张完整的卡片 */
      width: calc((100% - 40px) / 3); 
      aspect-ratio: 1080 / 790; 
      background-color: #f0f0f0; 
      border-radius: 8px;
      position: relative; 
      overflow: hidden; 
      cursor: grab;
      scroll-snap-align: start; /* 对齐到卡片起始位置 */
    }

    /* 图片样式：完整显示，不做裁剪 */
    .card-item img {
      width: 100%;
      height: 100%;
      object-fit: contain; 
      display: block;
      pointer-events: none; 
      -webkit-user-drag: none;
    }

    /* 悬浮文字层 */
    .card-text-overlay {
      position: absolute; 
      bottom: 12px;       
      left: 12px;         
      display: flex;
      align-items: center;
      gap: 8px;           
      color: #ffffff;
      font-size: 14px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); 
      z-index: 10;
      width: calc(100% - 24px); /* 防止文字太长撑破卡片 */
    }

    .card-text-overlay .tag {
      background-color: #ffffff;
      color: #000000;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 2px;
      font-weight: bold;
      text-shadow: none; 
      flex-shrink: 0; /* 标签不许被挤压 */
    }

    /* 文字内容超出显示省略号 */
    .card-text-overlay .desc {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* === 左右箭头样式 === */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      background-color: transparent; /* 透明底 */
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 20;
      font-size: 32px;
      color: #c4c4c4; /* 浅灰色 */
      opacity: 0; /* 默认隐藏，鼠标移入才显示 */
      pointer-events: none;
      transition: opacity 0.3s ease, color 0.3s ease;
    }

    /* 鼠标移到轮播区域时才显示箭头 */
    .carousel-wrapper:hover .arrow {
      opacity: 1;
      pointer-events: auto;
    }

    .arrow:hover {
      color: #909090;
    }

    /* 左箭头贴着容器左边缘 */
    .arrow-left { left: 0; }
    /* 右箭头贴着容器右边缘 */
    .arrow-right { right: 0; }

    /* 滑到最左/最右时箭头置灰不可用 */
    .carousel-wrapper:hover .arrow.disabled {
      opacity: 0.25;
      pointer-events: none;
      cursor: default;
    }

    /* 底部小圆点导航 */
    .dots-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    .dot-icon {
      font-size: 10px;
      color: #d9d9d9; 
      cursor: pointer;
      transition: color 0.3s;
    }

    .dot-icon.active {
      color: #999;
    }
</style>

  <div class="recommend-section">
    <h2 class="section-title">精彩推荐</h2>

    <!-- 新增：轮播图包裹层（用于定位左右箭头） -->
    <div class="carousel-wrapper">
      
      <!-- 左箭头 -->
      <div class="arrow arrow-left" id="btnLeft"><i class="iconfont icon-jiantou"></i></div>
      
      <!-- 卡片区 -->
      <div class="card-list">
        <!-- 为了演示精简，只保留3张，你可以继续用你的11张 -->
        <div class="card-item">
          <img src="./img/1-1.png" alt="封面图">

            <span class="tag">商城</span>

          </div>
        </div>

        <div class="card-item">
          <img src="./img/1-2.png" alt="封面图">
          <div class="card-text-overlay">
            <span class="tag">星光卡</span>
            <span class="desc">立即预约鞠婧祎星光卡！</span>
          </div>
        </div>

        <div class="card-item">
          <img src="./img/1-3.png" alt="封面图">
          <div class="card-text-overlay">
            <span class="tag">数字专辑</span>
            <span class="desc">NMIXX迷你六辑&超会礼包正式上线</span>
          </div>
        </div>
        
        <div class="card-item">
          <img src="./img/1-4.png" alt="封面图">
          <div class="card-text-overlay">
            <span class="tag">首发</span>
            <span class="desc">任素汐全新单曲《当世界年纪小》温暖上线</span>
          </div>
        </div>
                    <!-- 卡片 5 -->
      <div class="card-item">
        <img src="./img/1-5.png" alt="封面图">
        
        <div class="card-text-overlay">
          <span class="tag">数字专辑</span>
          <span class="desc">IVE先行曲正式上线</span>
        </div>
      </div>

            <!-- 卡片 6 -->
      <div class="card-item">
        <img src="./img/1-6.png" alt="封面图">
        
        <div class="card-text-overlay">
          <span class="tag">数字专辑</span>
          <span class="desc">JxJ迷你一辑&超会礼包正式上线</span>
        </div>
      </div>
                    <!-- 卡片 7 -->
      <div class="card-item">
        <img src="./img/1-7.png" alt="封面图">
        
        <div class="card-text-overlay">
          <span class="tag">说唱</span>
          <span class="desc">王以太全新Live专辑上线</span>
        </div>
      </div>

            <!-- 卡片 8 -->
      <div class="card-item">
        <img src="./img/1-8.png" alt="封面图">
        
        <div class="card-text-overlay">
          <span class="tag">游戏</span>
          <span class="desc">《绝区零》菲欧妮EP正式上线</span>
        </div>
      </div>

            <!-- 卡片 9 -->
      <div class="card-item">
        <img src="./img/1-9.png" alt="封面图">
        
        <div class="card-text-overlay">
          <span class="tag">音乐人</span>
          <span class="desc">黄霄云全新单曲《共赴》正式上线！</span>
        </div>
      </div>

            <!-- 卡片 10 -->
      <div class="card-item">
        <img src="./img/1-10.png" alt="封面图">
        
        <div class="card-text-overlay">
          <span class="tag">游戏</span>
          <span class="desc">《原神》逐月节活动剧情PV歌曲上线</span>
        </div>
      </div>

            <!-- 卡片 11 -->
      <div class="card-item">
        <img src="./img/1-11.png" alt="封面图">
        
        <div class="card-text-overlay">
          <span class="tag">影视</span>
          <span class="desc">肖战《轻轻》描绘人生的聚散与离别</span>
        </div>
      </div>
      </div>
                  <!-- 卡片 11 -->
      <div class="card-item">
        <img src="./img/1-12.png" alt="封面图">
        
        <div class="card-text-overlay">
          <span class="tag">KPOP</span>
          <span class="desc">Crush新歌FeatIU惊喜上线</span>
        </div>
      </div>
      </div>
      

      <!-- 右箭头 -->
      <div class="arrow arrow-right" id="btnRight"><i class="iconfont icon-youjiantoucu"></i></div>
      
    </div>

    <!-- 底部导航点（由 JS 根据总卡片数量动态生成） -->
    <div class="dots-container"></div>

  </div>

  <script>
    (() => {
      const list = document.querySelector('.card-list');
      const btnLeft = document.getElementById('btnLeft');
      const btnRight = document.getElementById('btnRight');
      const dotsWrap = document.querySelector('.dots-container');
      
      const CARDS_PER_PAGE = 3;

      // 单张卡片滑动的距离 = 卡片实际宽度 + 间距(gap)
      const getCardStep = () => {
        const card = list.querySelector('.card-item');
        if (!card) return 0;
        const cardWidth = card.offsetWidth;
        const gap = parseInt(window.getComputedStyle(list).gap) || 20;
        return cardWidth + gap;
      };

      // 一页滑动的距离 = 单张距离 * 每页张数
      const getPageStep = () => getCardStep() * CARDS_PER_PAGE;

      // 动态生成圆点（三张一页，根据总卡片数量计算页数）
      const buildDots = () => {
        const totalCards = list.querySelectorAll('.card-item').length;
        const pageCount = Math.max(1, Math.ceil(totalCards / CARDS_PER_PAGE));
        
        dotsWrap.innerHTML = '';
        for (let i = 0; i < pageCount; i++) {
          const dot = document.createElement('i');
          dot.className = 'iconfont icon-yuandian dot-icon';
          if (i === 0) dot.classList.add('active');
          dot.dataset.index = i; // 记录点击的是第几页
          dotsWrap.appendChild(dot);
        }
        return dotsWrap.querySelectorAll('.dot-icon');
      };

      let dots = buildDots();

      // 更新箭头状态（如果在最左边，左箭头变灰；在最右边，右箭头变灰）
      const updateArrows = () => {
        // 允许的误差 1px
        if (list.scrollLeft <= 1) {
          btnLeft.classList.add('disabled');
        } else {
          btnLeft.classList.remove('disabled');
        }

        if (list.scrollLeft + list.clientWidth >= list.scrollWidth - 1) {
          btnRight.classList.add('disabled');
        } else {
          btnRight.classList.remove('disabled');
        }
      };

      // 更新底部圆点状态
      const updateDots = () => {
        const step = getPageStep();
        if (step === 0) return;
        
        // 计算当前滑动到了第几页
        const currentIndex = Math.round(list.scrollLeft / step);
        
        // 限制下标防止越界
        const maxIndex = dots.length - 1;
        const activeIndex = Math.min(Math.max(0, currentIndex), maxIndex);
        
        dots.forEach((d, i) => d.classList.toggle('active', i === activeIndex));
      };

      // === 点击箭头滚动逻辑 ===
      btnLeft.addEventListener('click', () => {
        list.scrollBy({ left: -getPageStep(), behavior: 'smooth' });
      });

      btnRight.addEventListener('click', () => {
        list.scrollBy({ left: getPageStep(), behavior: 'smooth' });
      });

      // === 点击底部圆点滚动逻辑 ===
      dotsWrap.addEventListener('click', (e) => {
        const dot = e.target.closest('.dot-icon');
        if (!dot) return;
        const index = Number(dot.dataset.index);
        list.scrollTo({ left: index * getPageStep(), behavior: 'smooth' });
      });

      // 滚动时更新箭头和圆点
      let ticking = false;
      list.addEventListener('scroll', () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          updateDots();
          updateArrows();
          ticking = false;
        });
      });

      // === 原有拖拽逻辑保持不变 ===
      let isDown = false, startX = 0, startScroll = 0;
      list.addEventListener('pointerdown', (e) => {
        if (e.pointerType !== 'mouse') return;
        isDown = true;
        startX = e.clientX;
        startScroll = list.scrollLeft;
        list.style.scrollBehavior = 'auto'; 
        list.classList.add('dragging');
        list.setPointerCapture(e.pointerId);
      });
      list.addEventListener('pointermove', (e) => {
        if (!isDown) return;
        list.scrollLeft = startScroll - (e.clientX - startX);
      });
      const endDrag = (e) => {
        if (!isDown) return;
        isDown = false;
        list.classList.remove('dragging');
        list.style.scrollBehavior = 'smooth';
        if (e && list.hasPointerCapture && list.hasPointerCapture(e.pointerId)) {
          list.releasePointerCapture(e.pointerId);
        }
      };
      list.addEventListener('pointerup', endDrag);
      list.addEventListener('pointercancel', endDrag);
      list.addEventListener('pointerleave', endDrag);

      // 窗口尺寸变化重置
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          dots = buildDots();
          updateDots();
          updateArrows();
        }, 150);
      });

      // 初始化状态
      updateDots();
      updateArrows();
    })();
  </script>
</body>
</html>
