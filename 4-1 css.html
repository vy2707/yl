<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2,h3,p{
            padding:0;
            margin:0;
        }
        #box{
            width:500px;
            padding:8px;  /*距离*/
            border:1px solid #2816f1cc; /*边框*/
            font-size:14px;
            margin:20px;
        }
        #box h3{
            font-size:16px;
            text-align:center;/*居中*/
            line-height:40px;/*设置行高40px*/
            color:rgb(93, 6, 119);
        }
        #box p{
            line-height:300%;/*行高300%*/
            color:hsla(224, 93%, 36%, 0.847);
            /*首行缩进2em*/
            text-indent:2em;
        }
        .yname{
            color:rgb(6, 9, 23); /*深色加粗*/
            font-weight:bold;
        }
        .xuehao{
            color:blue;/*蓝色加粗*/
            font-weight:bold;
        }
        .nandu{
            color:red;/*红色加粗*/
            font-weight: bold;
        }
        .newbox{
            border:2px purple solid; /*知识点紫色边框，边框为额外内容*/
            box-sizing: content-box;
        }
      
    </style>



</head>
<body>
    <h2>css进阶</h2>
    <div id="box">
        <h3>CSS那些事</h3>
        <p>
            学号：<span class="xuehao">630</span>，姓名：<span class="yname">姚琳</span>，班级：计算机24006，对于《高级网页设计》课程的难度认知为：<span class="nandu">难</span>，
            这个例子对应的知识点是：<span class="newbox">群组选择器、后代选择器、层叠与继承。</span>
            <a href="#">更多</a>
        </p>
    </div>
    <!--学号；蓝色加粗；姓名：深色加粗；难度的值：红色加粗；知识点：紫色边框，边框为额外内容，使用内部css-->
</body>
</html>
