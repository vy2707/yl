<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精彩推荐 - 完美间距悬浮箭头</title>
    <!-- 替换为你自己的 iconfont 路径 -->
    <link rel="stylesheet" href="./font_1/iconfont.css">
</head>
<body>

<style>
    /* 基础重置 */
    * { box-sizing: border-box; }
    body { margin: 0; background-color: #f7f7f7; }

    /* 主容器：限制最大宽度，居中显示 */
    .recommend-section {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .section-title {
      text-align: center;
      font-size: 24px;
      font-weight: 500;
      color: #333;
      margin-bottom: 20px;
    }

    /* 【核心修改 1】扩大悬停区域和边距 */
    .carousel-wrapper {
      position: relative;
      width: 100%;
      /* 左右各留出 220px 给箭头，这就是你想要b的“距离” */
      padding: 0 220px; 
      /* 为了防止大屏下鼠标移到屏幕边缘箭头消失，我们把触发感应区向外扩展 */
      margin: 0 -220px;
      width: calc(100% + 440px); /* 2 * 220px */
    }

    /* 卡片滑动容器 */
    .card-list {
      display: flex;
      flex-wrap: nowrap;
      gap: 20px; 
      overflow-x: auto; 
      scroll-snap-type: x mandatory; 
      scroll-behavior: smooth; 
      -webkit-overflow-scrolling: touch; 
      scrollbar-width: none;    
      -ms-overflow-style: none; 
      cursor: default; 
      user-select: none;
      -webkit-user-select: none;
      padding-bottom: 10px; 
    }
    .card-list::-webkit-scrollbar { display: none; }

    /* 卡片 */
    .card-item {
      flex: 0 0 auto; 
      width: calc((100% - 40px) / 3); 
      aspect-ratio: 1080 / 790; 
      background-color: #f0f0f0; 
      border-radius: 8px;
      position: relative; 
      overflow: hidden; 
      cursor: pointer; 
      scroll-snap-align: start; 
    }

    .card-item img {
      width: 100%;
      height: 100%;
      object-fit: cover; 
      display: block;
      pointer-events: none; 
      -webkit-user-drag: none;
    }

    /* 悬浮文字层 */
    .card-text-overlay {
      position: absolute; 
      bottom: 12px;       
      left: 12px;         
      display: flex;
      align-items: center;
      gap: 8px;           
      color: #ffffff;
      font-size: 14px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); 
      z-index: 10;
      width: calc(100% - 24px); 
    }

    .card-text-overlay .tag {
      background-color: #ffffff;
      color: #000000;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 2px;
      font-weight: bold;
      text-shadow: none; 
      flex-shrink: 0; 
    }

    .card-text-overlay .desc {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* === 左右箭头样式 === */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 70px;
      height: 100px;
      
      /* 半透明浅灰背景 */
      background-color: rgba(240, 240, 240, 0.9); 
      
      
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 999; 
      
      font-size: 44px;
      color: #666; 
      
      /* 默认隐藏 */
      opacity: 0; 
      pointer-events: none; 
      transition: opacity 0.4s ease, background-color 0.3s ease, color 0.3s ease;
    }

    /* 【核心修改 2】鼠标移入整个包裹层（包括外侧留白），箭头平滑出现 */
    .carousel-wrapper:hover .arrow {
      opacity: 1;
      pointer-events: auto;
    }

    /* 鼠标放到箭头上，方块颜色变深 */
    .arrow:hover { 
      color: #333; 
      background-color: rgba(220, 220, 220, 1); 
    }

    /* 把箭头定位在留白区的边缘（距离图片 80px） */
    .arrow-left { 
      left: 0; 
    }
    .arrow-right { 
      right: 0; 
    }

    /* 底部小圆点 */
    .dots-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    .dot-icon {
      font-size: 10px;
      color: #d9d9d9; 
      cursor: pointer;
      transition: color 0.3s;
    }

    .dot-icon.active { color: #999; }
</style>

  <div class="recommend-section">
    <h2 class="section-title">精彩推荐</h2>

    <div class="carousel-wrapper">
      
      <!-- 左箭头（距离图片 80px） -->
      <div class="arrow arrow-left" id="btnLeft"><i class="iconfont icon-jiantou"></i></div>
      
      <!-- 卡片区 -->
      <div class="card-list" id="cardList">
        <div class="card-item">
          <img src="./img/1-1.png" alt="封面图">
          <div class="card-text-overlay">
            <span class="tag">商城</span>
            <span class="desc">肖战巡回演唱会官方周边预售开启</span>
          </div>
        </div>
        <div class="card-item">
          <img src="./img/1-2.png" alt="封面图">
          <div class="card-text-overlay">
            <span class="tag">星光卡</span>
            <span class="desc">立即预约鞠婧祎星光卡！</span>
          </div>
        </div>
        <div class="card-item">
          <img src="./img/1-3.png" alt="封面图">
          <div class="card-text-overlay">
            <span class="tag">数字专辑</span>
            <span class="desc">NMIXX迷你六辑&超会礼包正式上线</span>
          </div>
        </div>
        <div class="card-item">
          <img src="./img/1-4.png" alt="封面图">
          <div class="card-text-overlay">
            <span class="tag">数字专辑</span>
            <span class="desc">任素汐全新单曲《当世界年纪小》温暖上线</span>
          </div>
        </div>
        <div class="card-item">
          <img src="./img/1-5.png" alt="封面图">
          <div class="card-text-overlay">
            <span class="tag">数字专辑</span>
            <span class="desc">IVE先行曲正式上线</span>
          </div>
        </div>
        <div class="card-item">
          <img src="./img/1-6.png" alt="封面图">
          <div class="card-text-overlay">
            <span class="tag">数字专辑</span>
            <span class="desc">JxJ迷你一辑&超会礼包正式上线</span>
          </div>
        </div>
        <div class="card-item">
          <img src="./img/1-7.png" alt="封面图">
          <div class="card-text-overlay">
            <span class="tag">说唱</span>
            <span class="desc">王以太全新Live专辑上线</span>
          </div>
        </div>
        <div class="card-item">
          <img src="./img/1-8.png" alt="封面图">
          <div class="card-text-overlay">
            <span class="tag">游戏</span>
            <span class="desc">《绝区零》菲欧妮EP正式上线</span>
          </div>
        </div>
        <div class="card-item">
          <img src="./img/1-9.png" alt="封面图">
          <div class="card-text-overlay">
            <span class="tag">音乐人</span>
            <span class="desc">黄霄云全新单曲《共赴》正式上线！</span>
          </div>
        </div>
        <div class="card-item">
          <img src="./img/1-10.png" alt="封面图">
          <div class="card-text-overlay">
            <span class="tag">游戏</span>
            <span class="desc">《原神》逐月节活动剧情PV歌曲上线</span>
          </div>
        </div>
        <div class="card-item">
          <img src="./img/1-11.png" alt="封面图">
          <div class="card-text-overlay">
            <span class="tag">影视</span>
            <span class="desc">肖战《轻轻》描绘人生的聚散与离别</span>
          </div>
        </div>
        <div class="card-item">
          <img src="./img/1-12.png" alt="封面图">
          <div class="card-text-overlay">
            <span class="tag">KPOP</span>
            <span class="desc">Crush新歌FeatIU惊喜上线</span>
          </div>
        </div>
      </div>

  
      <!-- 右箭头（距离图片 100px） -->
      <div class="arrow arrow-right" id="btnRight"><i class="iconfont icon-youjiantoucu"></i></div>
      
    </div>

    <!-- 底部导航点 -->
    <div class="dots-container"></div>

  </div>

  <script>
    (() => {
      const list = document.getElementById('cardList');
      const btnLeft = document.getElementById('btnLeft');
      const btnRight = document.getElementById('btnRight');
      const dotsWrap = document.querySelector('.dots-container');
      
      const CARDS_PER_PAGE = 3;

      const getCardStep = () => {
        const card = list.querySelector('.card-item');
        if (!card) return 0;
        const cardWidth = card.offsetWidth;
        const gap = parseInt(window.getComputedStyle(list).gap) || 20;
        return cardWidth + gap;
      };

      const getPageStep = () => getCardStep() * CARDS_PER_PAGE;

      const buildDots = () => {
        const totalCards = list.querySelectorAll('.card-item').length;
        const pageCount = Math.max(1, Math.ceil(totalCards / CARDS_PER_PAGE));
        
        dotsWrap.innerHTML = '';
        for (let i = 0; i < pageCount; i++) {
          const dot = document.createElement('i');
          dot.className = 'iconfont icon-yuandian dot-icon';
          if (i === 0) dot.classList.add('active');
          dot.dataset.index = i;
          dotsWrap.appendChild(dot);
        }
        return dotsWrap.querySelectorAll('.dot-icon');
      };

      let dots = buildDots();

      const updateDots = () => {
        const step = getPageStep();
        if (step === 0) return;
        
        const currentCardIndex = Math.round(list.scrollLeft / getCardStep());
        const currentPage = Math.floor(currentCardIndex / CARDS_PER_PAGE);
        
        const maxIndex = dots.length - 1;
        const activeIndex = Math.min(Math.max(0, currentPage), maxIndex);
        
        dots.forEach((d, i) => d.classList.toggle('active', i === activeIndex));
      };

      // 右箭头点击
      btnRight.addEventListener('click', () => {
        const maxScrollLeft = list.scrollWidth - list.clientWidth;
        if (list.scrollLeft >= maxScrollLeft - 10) {
          list.scrollTo({ left: 0, behavior: 'smooth' });
        } else {
          let targetLeft = list.scrollLeft + getPageStep();
          if (targetLeft > maxScrollLeft) targetLeft = maxScrollLeft;
          list.scrollTo({ left: targetLeft, behavior: 'smooth' });
        }
      });

      // 左箭头点击
      btnLeft.addEventListener('click', () => {
        if (list.scrollLeft <= 10) {
          const maxScrollLeft = list.scrollWidth - list.clientWidth;
          list.scrollTo({ left: maxScrollLeft, behavior: 'smooth' });
        } else {
          let targetLeft = list.scrollLeft - getPageStep();
          if (targetLeft < 0) targetLeft = 0;
          list.scrollTo({ left: targetLeft, behavior: 'smooth' });
        }
      });

      // 圆点点击
      dotsWrap.addEventListener('click', (e) => {
        const dot = e.target.closest('.dot-icon');
        if (!dot) return;
        const index = Number(dot.dataset.index);
        
        const maxScrollLeft = list.scrollWidth - list.clientWidth;
        let targetLeft = index * getPageStep();
        
        if (index === dots.length - 1) {
          targetLeft = maxScrollLeft;
        }
        
        list.scrollTo({ left: targetLeft, behavior: 'smooth' });
      });

      // 滚动监听更新圆点
      let ticking = false;
      list.addEventListener('scroll', () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          updateDots();
          ticking = false;
        });
      });

      // 窗口尺寸变化重置
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          dots = buildDots();
          updateDots();
        }, 150);
      });

      updateDots();
    })();
  </script>
</body>
</html>
